# AORTA drop-in, mounted read-only; included by the generated smb.conf
# (include = conf.d/*.conf appends everything to [global]).
[global]
    # lab DC: records added without Kerberos DNS-update creds
    allow dns updates = nonsecure
    # never auto-register the container's eth0 IPv4 (start-aorta-dc.sh pins all
    # names to the VPN IP); kill switch below covers the task anyway
    server services = -dnsupdate
    dns update command = /bin/true
